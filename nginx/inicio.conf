# Página inicial: lista os apps. Instalado por scripts/instalar.sh (__DOMINIO__ é trocado pelo domínio).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__ www.__DOMINIO__;

    root /var/www/orbittracking;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
