# TrajectoryOrbitPropag (Streamlit, serviço systemd em 127.0.0.1:8080). Instalado por scripts/instalar.sh.
server {
    listen 80;
    listen [::]:80;
    server_name propag.__DOMINIO__;

    client_max_body_size 200m;              # limite padrão de upload do Streamlit

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # O Streamlit fala com o navegador por WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;          # sessão aberta enquanto a aba estiver aberta
    }
}
